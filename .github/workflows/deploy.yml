name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          # Monta o artifact preservando a estrutura servida em producao:
          # Detecta se os arquivos estao na raiz ou dentro da pasta Nexus/
          mkdir -p _dist
          
          if [ -d "Nexus/site" ]; then
            SITE_DIR="Nexus/site"
            DADOS_DIR="Nexus/dados"
            INDEX_FILE="Nexus/index.html"
          else
            SITE_DIR="site"
            DADOS_DIR="dados"
            INDEX_FILE="index.html"
          fi
          
          if [ -f "$INDEX_FILE" ]; then
            cp "$INDEX_FILE" _dist/index.html
          fi
          cp -r "$SITE_DIR" _dist/site
          cp -r "$DADOS_DIR" _dist/dados
          touch _dist/.nojekyll
          touch _dist/site/.nojekyll

          # Lista de todos os JSON de dados para precache offline do Service Worker.
          python3 - <<'PY'
          import os, json
          urls = []
          for root, _, files in os.walk('_dist/dados'):
              for f in files:
                  if f.endswith('.json'):
                      p = os.path.join(root, f).replace('_dist/dados', '../dados').replace(os.sep, '/')
                      urls.append(p)
          with open('_dist/site/dados-precache.json', 'w', encoding='utf-8') as fh:
              json.dump(sorted(urls), fh, ensure_ascii=False)
          PY

          # Lista de todos os modulos JS para precache offline do Service Worker.
          python3 - <<'PY'
          import os, json
          urls = []
          for root, _, files in os.walk('_dist/site/js'):
              for f in files:
                  if f.endswith('.js'):
                      p = os.path.join(root, f).replace('_dist/site', '.').replace(os.sep, '/')
                      urls.append(p)
          with open('_dist/site/js-precache.json', 'w', encoding='utf-8') as fh:
              json.dump(sorted(urls), fh, ensure_ascii=False)
          print(f'js-precache.json: {len(urls)} modulos')
          PY

          # Atualiza a versao do cache no Service Worker para o numero do run do GitHub Actions
          # Usa regex flexivel para garantir a substituicao mesmo se o valor inicial mudar
          sed -i "s|const CACHE_VERSION = [^;]*;|const CACHE_VERSION = ${{ github.run_number }};|" _dist/site/sw.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
