<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://*.googleusercontent.com https://*.google.com; connect-src 'self' https://*.googleapis.com https://firestore.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://www.gstatic.com; font-src 'self' https://fonts.gstatic.com; frame-src https://accounts.google.com https://*.firebaseapp.com; object-src 'none'; base-uri 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121214">
  <title>Nexus D&D 5.5</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="img/icon.svg">
  <link rel="apple-touch-icon" sizes="192x192" href="img/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="img/icon-512.png">
  <link rel="stylesheet" href="css/app.css">
  <!-- Firebase SDK (preload para cache offline) -->
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js">
</head>
<body>

  <!-- Splash screen para carregamento e abertura como App -->
  <div id="app-splash" class="app-splash-screen" aria-hidden="true">
    <div class="app-splash-content">
      <img src="img/nexus-tela.svg" alt="Nexus D&D 5.5" class="app-splash-logo">
    </div>
  </div>

  <!-- Barra de navegação superior -->
  <header id="app-header">
    <div class="header-left">
      <button id="btn-voltar" class="header-btn" style="display:none" aria-label="Voltar">
        <svg id="icone-voltar" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <a href="#home" class="header-nexus-link" title="Nexus D&D 5.5 - Início">
        <img src="img/nexus-icon.svg" alt="Nexus D&D" class="header-nexus-logo">
      </a>
      <span class="header-divider" id="header-divider" aria-hidden="true"></span>
    </div>
    <h1 id="header-titulo"></h1>
    <div id="header-acoes"></div>
    <img src="img/dnd-logo.svg" alt="D&D Logo" class="header-logo">
  </header>

  <!-- Conteúdo principal (gerenciado pelo router) -->
  <main id="app-content"></main>

  <!-- Rodapé Global -->
  <footer id="app-footer" class="app-footer">
    <p class="app-footer-texto">© 2026 Nexus D&D. Todos os direitos sobre os sistemas, marcas, obras e produtos de terceiros pertencem aos seus respectivos detentores.</p>
  </footer>

  <!-- Modal reutilizável -->
  <div id="modal-overlay" class="modal-overlay" style="display:none">
    <div id="modal-container" class="modal-container">
      <div id="modal-header" class="modal-header">
        <h2 id="modal-titulo"></h2>
        <button class="modal-fechar" onclick="fecharModal()">&times;</button>
      </div>
      <div id="modal-corpo" class="modal-corpo"></div>
      <div id="modal-acoes" class="modal-acoes"></div>
    </div>
  </div>

  <!-- Toast de notificação -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts como módulos ES -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
